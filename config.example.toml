app_id = "your_app_id"
app_secret = "your_app_secret"
sandbox = true

# 连接与协议
ws_reconnect_max_delay = 60

# LLM
llm_api_key = "your_api_key"
llm_base_url = "https://api.deepseek.com/v1"
llm_model = "deepseek-chat"
llm_timeout = 30.0
llm_history_path = "data/history.json"

# 防刷屏
llm_max_concurrency = 3
llm_concurrency_window = 60

# 防炸库
llm_memory_gc_days = 7
llm_memory_gc_interval = 86400

# 模型参数
llm_temperature = 0.7
llm_top_p = 0.9
llm_max_tokens = 1024
llm_context_limit = 10
llm_thinking = "disabled"
llm_reasoning_effort = "medium"
llm_json_mode = false
llm_logprobs = false

# 唤醒策略
llm_reply_mode = "smart"
llm_wake_keywords = ["诺喵莉", "喵莉"]
llm_eval_prompt = "你需要判断是否需要回复这句话。只输出 YES 或 NO。"
llm_vision_enabled = true

# MCP 长期记忆服务
mcp_enabled = false
mcp_host = "127.0.0.1"
mcp_port = 8080
mcp_token = ""

# 潜意识旁路
llm_subconscious_enabled = true
llm_subconscious_prompt = "你是后台观察者。当前时间是：{current_time}。请提取关于【{user_name}】的重要事实或情绪，提取事实时，必须带上明确的时间节点（基于系统提供的当前时间推算相对时间）。输出格式必须为：『{user_name}：提取出的事实』。如果没有任何重要信息，不要输出任何单词，只输出空字符串，绝对不要输出 NONE。"
llm_subconscious_window = 60
llm_subconscious_min_length = 6

# 思绪展示
llm_thought_mode = "easter_egg"
llm_thought_max_chars = 120
llm_thought_hints = ["思绪", "在想什么", "内心", "思考过程"]

# 日志
log_retention = "7 days"
log_dir = "logs"